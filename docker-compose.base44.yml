services:
  app:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - PORT=3000
      - NODE_ENV=development
      - PREVIEW_MODE=true
      - PREVIEW_DATA_FILE=/tmp/preview-data.json
      - REACT_APP_BACKEND_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    ports:
      - "3000:3000"
    command: sh -c "npm install --silent && npm run dev"
    restart: unless-stopped
